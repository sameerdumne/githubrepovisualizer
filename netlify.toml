# Netlify configuration for RepoViz
# Deploy your Next.js app to Netlify

[build]
  command = "npm run build"

[build.plugins]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "npm run dev"
  port = 3000

# Redirect all requests to _next/static with cache headers
[[redirects]]
  from = "/_next/static/*"
  to = "/_next/static/:splat"
  status = 200
  cache_control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache headers for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/github-icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Environment variables (set these in Netlify UI)
# NEXT_PUBLIC_GEMINI_API_KEY - Your Gemini API key
# GITHUB_TOKEN - Your GitHub personal access token
# GITHUB_CLIENT_ID - GitHub OAuth App client ID
# GITHUB_CLIENT_SECRET - GitHub OAuth App client secret
# AUTH_SECRET - Long random string used to sign login session cookies
# SUPABASE_URL - Your Supabase project URL
# SUPABASE_SERVICE_ROLE_KEY - Supabase service role key for server-side history storage
# NEXT_PUBLIC_APP_URL - Your Netlify app URL
